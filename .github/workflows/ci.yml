name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dashboard
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dashboard:dashboard@127.0.0.1:5432/dashboard?schema=public
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters
      FRONTEND_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
      SHOP_PUBLIC_URL: http://127.0.0.1:3001
      PORT: 5051
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5051/api
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI verification
        run: npm run test:ci

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            dashboard/test-results/
