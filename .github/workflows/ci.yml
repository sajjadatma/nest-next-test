name: Quality gates

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dashboard_test
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dashboard:dashboard@127.0.0.1:5432/dashboard_test?schema=public
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters
      FRONTEND_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix dashboard ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:frontend
      - run: npm run test:integration
      - run: npm run test:database
      - run: npm run build
      - run: npm run test:e2e
